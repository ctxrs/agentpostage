name: Publish MCP listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download pinned publisher
        run: |
          curl --fail --location --output publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
      - name: Validate listing
        run: ./mcp-publisher validate server.json
      - name: Authenticate without a stored secret
        run: ./mcp-publisher login github-oidc
      - name: Publish listing
        run: ./mcp-publisher publish server.json
